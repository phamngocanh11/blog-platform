<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-gutter">
<!-- Transactional Canvas - Navigation Suppressed -->
<main class="w-full max-w-4xl grid md:grid-cols-2 gap-section-gap bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(49,103,99,0.04)] overflow-hidden">
<!-- Left Column: Form -->
<div class="p-8 md:p-12 flex flex-col justify-center">
<div class="mb-12">
<a class="inline-block mb-8 font-display-xl text-display-xl text-primary" href="/">The Ledger</a>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to access your editorial workspace.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="email">Email address</label>
<input class="block w-full rounded bg-surface-container border-transparent focus:border-secondary focus:bg-surface-container-lowest focus:ring-0 font-body-md text-body-md text-on-surface py-3 px-4 transition-colors" id="email" name="email" required="" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-2">
<label class="block font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<input class="block w-full rounded bg-surface-container border-transparent focus:border-secondary focus:bg-surface-container-lowest focus:ring-0 font-body-md text-body-md text-on-surface py-3 px-4 transition-colors" id="password" name="password" required="" type="password"/>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-secondary focus:ring-secondary border-outline-variant rounded bg-surface-container" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<div>
<button class="w-full flex justify-center py-4 px-4 border border-transparent rounded bg-primary text-on-primary font-label-sm text-label-sm hover:bg-on-surface transition-colors shadow-sm" type="submit">
                        Sign in
                    </button>
</div>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-dim"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-body-md text-body-md text-on-surface-variant">Or continue with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-4">
<button class="w-full inline-flex justify-center py-3 px-4 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-label-sm text-label-sm hover:bg-surface-container-low transition-colors items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">login</span>
                        Google
                    </button>
<button class="w-full inline-flex justify-center py-3 px-4 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-label-sm text-label-sm hover:bg-surface-container-low transition-colors items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">login</span>
                        Apple
                    </button>
</div>
</div>
<p class="mt-8 text-center font-body-md text-body-md text-on-surface-variant">
                Don't have an account? <a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors underline" href="#">Register here</a>
</p>
</div>
<!-- Right Column: Visual -->
<div class="hidden md:block relative bg-surface-variant">
<img alt="A serene, minimalist reading room bathed in soft, diffused morning light." class="absolute inset-0 h-full w-full object-cover mix-blend-multiply opacity-80" data-alt="A serene, minimalist reading room bathed in soft, diffused morning light. The space features highly textured, heavy stock paper scattered elegantly across a polished dark wood desk. A single, classic fountain pen rests nearby. The lighting creates a high-contrast yet calm mood, perfectly aligning with a sophisticated, intellectual modernist aesthetic. The color palette emphasizes deep blacks, pristine whites, and subtle hints of warm gray, evoking the quiet focus of a digital library." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzHQY6BVcVFeHL8tbeLrV8yVCSt93kASGziLxFnQttfFXMYFWFj1Ld6Ex0TwLK7oylxD1gKcpuHX5Cnl6fHOfD0_0g4oVpyOSO2ro7t7FvX1poOpC4P9vb2iVydDnryupeXyewP600GURfU5AIuJBzhvN_UiL5GAubm1-gujqYo8zpyj60VGvFfQRCXhYKZUHr9kIWiDEq3zfZHXKTitsJjXz7ahhumbmzc_miJyAazq-kl_QcAy_xbIgtrqQWB-HGvvYiRm2o4vyG"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface-variant/80 to-transparent"></div>
<div class="absolute bottom-12 left-12 right-12 text-on-surface">
<blockquote class="font-headline-md text-headline-md italic mb-4">
                    "The art of writing is the art of discovering what you believe."
                </blockquote>
<p class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">— Gustave Flaubert</p>
</div>
