<div class="flex flex-col gap-4 text-center">

<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[360px] mx-auto">
                    Enter the email associated with your account and we will send you a link to reset your password.
                </p>
</div>
<form action="#" class="flex flex-col gap-6" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-DEFAULT px-4 py-3 font-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200 placeholder:text-outline/50" id="email" name="email" placeholder="your@email.com" required="" type="email"/>
</div>
<button class="w-full bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-widest py-4 rounded-DEFAULT hover:bg-tertiary transition-colors duration-300 ease-in-out shadow-sm mt-2" type="submit">

                </button>
</form>
<div class="pt-6 border-t border-outline-variant/20 text-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors duration-200 inline-flex items-center gap-2 group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform duration-200">arrow_back</span>

</div>
