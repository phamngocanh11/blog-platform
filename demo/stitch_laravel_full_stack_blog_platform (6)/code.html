<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editorial Post Editor - The Ledger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed-variant": "#574425",
                        "tertiary": "#000000",
                        "surface-variant": "#e4e2e4",
                        "surface": "#fcf8fa",
                        "tertiary-fixed": "#fcdeb5",
                        "secondary": "#316763",
                        "primary-fixed-dim": "#bec6e0",
                        "inverse-primary": "#bec6e0",
                        "on-secondary": "#ffffff",
                        "primary": "#000000",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "background": "#fcf8fa",
                        "primary-container": "#131b2e",
                        "on-primary-container": "#7c839b",
                        "surface-container": "#f0edef",
                        "secondary-fixed-dim": "#9ad1cb",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#dec29a",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-tint": "#565e74",
                        "outline": "#76777d",
                        "on-secondary-container": "#376d69",
                        "on-error-container": "#93000a",
                        "surface-container-highest": "#e4e2e4",
                        "on-primary-fixed": "#131b2e",
                        "on-background": "#1b1b1d",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#b5ede7",
                        "surface-container-low": "#f6f3f5",
                        "secondary-fixed": "#b5ede7",
                        "on-tertiary-fixed": "#271901",
                        "on-surface": "#1b1b1d",
                        "outline-variant": "#c6c6cd",
                        "on-surface-variant": "#45464d",
                        "on-tertiary-container": "#98805d",
                        "on-secondary-fixed": "#00201e",
                        "surface-dim": "#dcd9db",
                        "tertiary-container": "#271901",
                        "surface-bright": "#fcf8fa",
                        "on-secondary-fixed-variant": "#144f4b",
                        "primary-fixed": "#dae2fd",
                        "inverse-on-surface": "#f3f0f2",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#303032",
                        "surface-container-high": "#eae7e9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1280px",
                        "gutter": "24px",
                        "section-gap": "80px",
                        "reading-width": "720px",
                        "base-unit": "8px"
                    },
                    "fontFamily": {
                        "display-xl": ["Newsreader", "serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "label-sm": ["Inter", "sans-serif"],
                        "headline-md": ["Newsreader", "serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "headline-lg": ["Newsreader", "serif"]
                    },
                    "fontSize": {
                        "display-xl": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.7", "fontWeight": "400" }],
                        "headline-lg": ["40px", { "lineHeight": "1.2", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased overflow-x-hidden">
<!-- Top AppBar -->
<header class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-md text-slate-900 dark:text-slate-50 font-serif italic text-lg tracking-tight docked full-width top-0 z-50 border-b border-slate-100 dark:border-slate-800 shadow-sm shadow-slate-200/20 dark:shadow-none flex justify-between items-center w-full px-8 h-16 max-w-7xl mx-auto fixed left-0 right-0">
<div class="flex items-center gap-8">
<div class="text-2xl font-serif font-bold text-slate-900 dark:text-slate-50 not-italic">
                The Ledger
            </div>
<nav class="hidden md:flex gap-6 not-italic">
<a class="text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-slate-100 transition-colors" href="#">Archive</a>
<a class="text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-slate-100 transition-colors" href="#">Topics</a>
<a class="text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-slate-100 transition-colors" href="#">Series</a>
<a class="text-slate-500 dark:text-slate-400 font-medium hover:text-slate-900 dark:hover:text-slate-100 transition-colors" href="#">About</a>
</nav>
</div>
<div class="flex items-center gap-6">
<button class="flex items-center justify-center text-slate-900 dark:text-slate-50 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
<button class="flex items-center justify-center text-slate-900 dark:text-slate-50 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="flex items-center justify-center text-slate-900 dark:text-slate-50 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</button>
<button class="bg-primary text-on-primary font-label-sm text-label-sm px-4 py-2 rounded-DEFAULT hover:opacity-90 transition-opacity not-italic">
                Write
            </button>
</div>
</header>
<div class="flex pt-16 min-h-screen">
<!-- Main Editor Canvas -->
<main class="flex-1 flex justify-center py-12 px-gutter overflow-y-auto">
<div class="w-full max-w-[720px] bg-surface-container-lowest rounded-lg p-12 shadow-sm shadow-slate-200/10 min-h-[800px]">
<!-- Editor Title -->
<input class="w-full bg-transparent border-none outline-none font-headline-lg text-headline-lg text-on-surface placeholder-on-surface-variant/50 mb-8 focus:ring-0 p-0" placeholder="Title..." type="text"/>
<!-- Editor Toolbar (Chrome-less approach, appears on focus ideally, but static here for UI rep) -->
<div class="flex items-center gap-4 mb-6 border-b border-surface-variant pb-4 text-on-surface-variant">
<button class="p-1 hover:text-primary transition-colors" title="Bold">
<span class="material-symbols-outlined" data-icon="format_bold">format_bold</span>
</button>
<button class="p-1 hover:text-primary transition-colors" title="Italic">
<span class="material-symbols-outlined" data-icon="format_italic">format_italic</span>
</button>
<button class="p-1 hover:text-primary transition-colors" title="Underline">
<span class="material-symbols-outlined" data-icon="format_underlined">format_underlined</span>
</button>
<div class="w-px h-6 bg-surface-variant mx-2"></div>
<button class="p-1 hover:text-primary transition-colors" title="Heading 1">
<span class="material-symbols-outlined" data-icon="format_h1">format_h1</span>
</button>
<button class="p-1 hover:text-primary transition-colors" title="Heading 2">
<span class="material-symbols-outlined" data-icon="format_h2">format_h2</span>
</button>
<div class="w-px h-6 bg-surface-variant mx-2"></div>
<button class="p-1 hover:text-primary transition-colors" title="Quote">
<span class="material-symbols-outlined" data-icon="format_quote">format_quote</span>
</button>
<button class="p-1 hover:text-primary transition-colors" title="Link">
<span class="material-symbols-outlined" data-icon="link">link</span>
</button>
<button class="p-1 hover:text-primary transition-colors" title="Image">
<span class="material-symbols-outlined" data-icon="image">image</span>
</button>
</div>
<!-- Editor Body Area -->
<div class="min-h-[500px] outline-none font-body-lg text-body-lg text-on-surface leading-relaxed" contenteditable="true">
<p class="text-on-surface-variant/50">Start writing your story...</p>
</div>
</div>
</main>
<!-- Post Settings Sidebar -->
<aside class="w-80 bg-surface-container-low border-l border-outline-variant/30 flex flex-col h-[calc(100vh-64px)] sticky top-16 overflow-y-auto">
<div class="p-6 border-b border-outline-variant/30 flex justify-between items-center bg-surface-container-lowest/50 backdrop-blur-sm sticky top-0 z-10">
<span class="font-label-sm text-label-sm text-on-surface">Post Settings</span>
<div class="flex items-center gap-2">
<span class="text-xs text-on-surface-variant">Draft saved</span>
<button class="bg-primary text-on-primary font-label-sm text-label-sm px-4 py-2 rounded-DEFAULT hover:opacity-90 transition-opacity">
                        Publish
                    </button>
</div>
</div>
<div class="p-6 space-y-8">
<!-- Thumbnail Upload -->
<div class="space-y-3">
<label class="font-label-sm text-label-sm text-on-surface block">Featured Image</label>
<div class="border-2 border-dashed border-outline-variant rounded-lg p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-surface-variant/20 transition-colors bg-surface-container-lowest">
<span class="material-symbols-outlined text-outline mb-2" data-icon="add_photo_alternate">add_photo_alternate</span>
<span class="text-sm text-on-surface-variant">Click to upload thumbnail</span>
<span class="text-xs text-outline mt-1">Recommended: 1200x630px</span>
</div>
</div>
<!-- Category -->
<div class="space-y-3">
<label class="font-label-sm text-label-sm text-on-surface block">Category</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-3 py-2 text-sm text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none">
<option>Select a category...</option>
<option>Technology</option>
<option>Design</option>
<option>Culture</option>
<option>Business</option>
</select>
</div>
<!-- Series -->
<div class="space-y-3">
<label class="font-label-sm text-label-sm text-on-surface block">Series</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-3 py-2 text-sm text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none">
<option>None (Standalone post)</option>
<option>The Design Systems Handbook</option>
<option>Modern Typographic Practices</option>
</select>
</div>
<!-- Tags -->
<div class="space-y-3">
<label class="font-label-sm text-label-sm text-on-surface block">Tags</label>
<div class="bg-surface-container-lowest border border-outline-variant rounded-DEFAULT p-2 flex flex-wrap gap-2 focus-within:border-secondary focus-within:ring-1 focus-within:ring-secondary">
<div class="bg-surface-variant text-on-surface-variant text-xs px-2 py-1 rounded-full flex items-center gap-1">
                            Editorial
                            <button class="hover:text-error"><span class="material-symbols-outlined text-[14px]" data-icon="close">close</span></button>
</div>
<input class="flex-1 min-w-[100px] border-none outline-none bg-transparent text-sm p-1 focus:ring-0" placeholder="Add a tag..." type="text"/>
</div>
</div>
<!-- Excerpt -->
<div class="space-y-3">
<label class="font-label-sm text-label-sm text-on-surface block">Excerpt</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT px-3 py-2 text-sm text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none resize-none" placeholder="A brief summary for previews..." rows="3"></textarea>
</div>
</div>
</aside>
</div>
</body></html>
